name: Refresh Static FPL Data

on:
  schedule:
    # Run shortly after the usual twice-daily source refresh windows (UTC).
    - cron: "30 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate and verify fresh static predictions
        run: |
          for refresh_attempt in 1 2 3; do
            echo "Refresh attempt ${refresh_attempt} of 3"
            if python generate_static_data.py && python validate_static_data.py; then
              exit 0
            fi
            if [ "${refresh_attempt}" -lt 3 ]; then
              echo "Refresh did not produce verified data; retrying in 2 minutes."
              sleep 120
            fi
          done
          echo "Static data refresh failed validation after 3 attempts. Existing published data was left unchanged."
          exit 1

      - name: Commit updated static data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/static_predictions.json data/prediction_windows data/static_backtest.json data/backtest_seasons.json data/backtests data/elo_snapshots.json
          git diff --cached --quiet || git commit -m "Refresh static FPL data"
          git push
